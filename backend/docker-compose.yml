# Coolify can deploy either this compose file or the Dockerfile directly.
# Compose is the clearer of the two: it states the volume and the health check
# in the same place the reverse proxy is configured.
services:
  lumina:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      LUMINA_DB: /data/sentinel.db
      LUMINA_FILES_DIR: /data/files
      # Set these in Coolify's environment UI, not here. They are deliberately
      # absent so a stolen compose file leaks nothing.
      #   LUMINA_OWNER_SECRET
      #   LUMINA_LICENSE_SECRET
      #   LUMINA_FRONTEND_ORIGIN
      #   LUMINA_LIVE=1  plus broker keys, only when you mean it
    volumes:
      - lumina-data:/data
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lumina-data:
